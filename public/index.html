<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo for Digital Operations</title>
  <style>
    /* Simple, clean layout — no frameworks needed */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
      background: #fafafa;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 1.6rem;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 32px;
      font-size: 0.95rem;
    }

    /* Search form */
    .search-form {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .search-form input {
      flex: 1;
      padding: 10px 14px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .search-form button {
      padding: 10px 20px;
      font-size: 1rem;
      background: #0057b7;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .search-form button:hover { background: #004494; }

    /* Results table */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid #e0e0e0;
    }

    th {
      background: #f0f0f0;
      font-weight: 600;
      width: 45%;
    }

    /* Status / error messages */
    .message {
      padding: 12px;
      border-radius: 6px;
      margin-top: 16px;
    }

    .message.error {
      background: #fdecea;
      color: #b71c1c;
    }

    .message.loading {
      background: #e3f2fd;
      color: #0d47a1;
    }

    .delay-positive { color: #c62828; font-weight: 600; }
    .delay-zero     { color: #2e7d32; font-weight: 600; }

    /* Live SMS feed */
    .live-feed {
      margin-top: 40px;
      border-top: 2px solid #e0e0e0;
      padding-top: 20px;
    }

    .live-feed h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pulse {
      width: 10px;
      height: 10px;
      background: #4caf50;
      border-radius: 50%;
      animation: pulse-anim 1.5s infinite;
    }

    @keyframes pulse-anim {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .feed-empty {
      color: #999;
      font-size: 0.9rem;
      font-style: italic;
    }

    .feed-event {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 10px;
      animation: slide-in 0.3s ease-out;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .feed-event .feed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .feed-event .feed-tag {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .feed-tag.received {
      background: #e3f2fd;
      color: #0d47a1;
    }

    .feed-tag.calling {
      background: #fff3e0;
      color: #e65100;
    }

    .feed-event .feed-from {
      font-size: 0.85rem;
      color: #666;
    }

    .feed-event .feed-time {
      font-size: 0.8rem;
      color: #999;
    }

    .feed-flight-info {
      font-size: 0.9rem;
      margin-top: 6px;
    }

    .feed-flight-info .feed-row {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
    }

    .feed-flight-info .feed-label {
      color: #666;
    }

  </style>
</head>
<body>

  <h1>Demo for Digital Operations</h1>
  <p class="subtitle">Enter a flight number to view operational details and delay information.</p>
  <p class="subtitle" style="margin-top:-20px; font-size:0.88rem;">Text a flight code to <strong>(229) 597-2468</strong> to get details via SMS and a voice call.</p>

  <!-- Search form: user types a flight identifier like AAL100 or DL245 -->
  <div class="search-form">
    <input type="text" id="flightInput" placeholder="e.g. AAL100, DL245, UAL354" />
    <button id="searchBtn">Search</button>
  </div>

  <!-- Results will be injected here by JavaScript -->
  <div id="results"></div>

  <!-- Live SMS feed -->
  <div class="live-feed">
    <h2><span class="pulse"></span> Live SMS Feed</h2>
    <div id="feedList"><p class="feed-empty">Waiting for incoming texts...</p></div>
  </div>

  <script>
    /**
     * ==========================================================
     *  HOW THE FRONTEND CALLS THE BACKEND
     * ==========================================================
     *  1. The user types a flight number and clicks "Search".
     *  2. JavaScript sends a GET request to /api/flight?ident=FLIGHTNUMBER
     *     — This is OUR backend, not the AeroAPI directly.
     *  3. The backend calls the AeroAPI (with the secret key) and
     *     returns the JSON result to us.
     *  4. We parse and display the data in a table.
     *
     *  The frontend NEVER contacts FlightAware directly and
     *  NEVER sees the API key. This is the secure pattern for
     *  calling third-party APIs from a web application.
     * ==========================================================
     */

    const input = document.getElementById("flightInput");
    const btn   = document.getElementById("searchBtn");
    const resultsDiv = document.getElementById("results");
    // Allow pressing Enter to search
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") searchFlight();
    });
    btn.addEventListener("click", searchFlight);

    async function searchFlight() {
      const ident = input.value.trim();
      if (!ident) return;

      // Show loading state
      resultsDiv.innerHTML = '<div class="message loading">Searching…</div>';

      try {
        // --- This is the call to OUR backend API route ---
        const res = await fetch("/api/flight?ident=" + encodeURIComponent(ident));
        const data = await res.json();

        if (!res.ok) {
          resultsDiv.innerHTML =
            '<div class="message error">Error: ' + escapeHtml(data.error || "Unknown error") + "</div>";
          return;
        }

        // The AeroAPI returns an array of flights in data.flights
        if (!data.flights || data.flights.length === 0) {
          resultsDiv.innerHTML =
            '<div class="message error">No flights found for ' + escapeHtml(ident) + ".</div>";
          return;
        }

        // Sort by scheduled departure (most recent first) and show up to 5
        const flights = [...data.flights]
          .sort((a, b) => (b.scheduled_out || "").localeCompare(a.scheduled_out || ""))
          .slice(0, 5);
        displayFlights(flights);
      } catch (err) {
        resultsDiv.innerHTML =
          '<div class="message error">Network error: ' + escapeHtml(err.message) + "</div>";
      }
    }

    /**
     * Display up to 5 recent flights, each in its own table.
     */
    function displayFlights(flights) {
      let html = "";
      for (const f of flights) {
        const depDelay = computeDelayMinutes(f.scheduled_out, f.actual_out);
        const arrDelay = computeDelayMinutes(f.scheduled_in, f.actual_in);

        const rows = [
          ["Airline / Flight", f.ident || "—"],
          ["Origin", formatAirport(f.origin)],
          ["Destination", formatAirport(f.destination)],
          ["Status", f.status || "—"],
          ["Scheduled departure", formatTime(f.scheduled_out)],
          ["Actual departure", formatTime(f.actual_out)],
          ["Departure delay", formatDelay(depDelay)],
          ["Scheduled arrival", formatTime(f.scheduled_in)],
          ["Actual arrival", formatTime(f.actual_in)],
          ["Arrival delay", formatDelay(arrDelay)],
        ];

        html += '<table style="margin-bottom:24px"><tbody>';
        for (const [label, value] of rows) {
          html += "<tr><th>" + escapeHtml(label) + "</th><td>" + value + "</td></tr>";
        }
        html += "</tbody></table>";
      }
      resultsDiv.innerHTML = html;
    }

    // --- Helper functions ---

    /**
     * Compute delay in minutes between two ISO-8601 timestamps.
     * Returns null if either timestamp is missing.
     */
    function computeDelayMinutes(scheduled, actual) {
      if (!scheduled || !actual) return null;
      const diff = new Date(actual) - new Date(scheduled); // milliseconds
      return Math.round(diff / 60000); // convert to minutes
    }

    /**
     * Format a delay value for display, with color coding.
     */
    function formatDelay(minutes, short) {
      if (minutes == null) return "—";
      if (minutes <= 0) {
        return '<span class="delay-zero">' + (short ? "On time" : minutes + " min (on time)") + "</span>";
      }
      return '<span class="delay-positive">+' + minutes + " min</span>";
    }

    /**
     * Format an ISO-8601 timestamp into a readable string.
     */
    function formatTime(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      return escapeHtml(d.toLocaleString());
    }

    /**
     * Format airport info from the AeroAPI airport object.
     */
    function formatAirport(airport) {
      if (!airport) return "—";
      const name = airport.name || "";
      const code = airport.code_iata || airport.code || "";
      return escapeHtml(code + (name ? " — " + name : ""));
    }

    /**
     * Basic HTML escaping to prevent XSS.
     */
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = String(str);
      return div.innerHTML;
    }

    // =============================================
    //  LIVE SMS FEED — polls /api/sms every 3s
    // =============================================
    const feedList = document.getElementById("feedList");
    let lastEventTime = null;
    let feedStarted = false;

    async function pollEvents() {
      try {
        let url = "/api/sms";
        if (lastEventTime) url += "?since=" + encodeURIComponent(lastEventTime);
        const res = await fetch(url);
        const data = await res.json();
        if (data.events && data.events.length > 0) {
          if (!feedStarted) {
            feedList.innerHTML = "";
            feedStarted = true;
          }
          for (const evt of data.events) {
            feedList.insertBefore(renderEvent(evt), feedList.firstChild);
            lastEventTime = evt.timestamp;
          }
          // Cap the feed to 50 items to prevent unbounded DOM growth
          while (feedList.children.length > 50) {
            feedList.removeChild(feedList.lastChild);
          }
        }
      } catch {
        // Silently ignore polling errors
      }
    }

    function renderEvent(evt) {
      const div = document.createElement("div");
      div.className = "feed-event";

      const time = new Date(evt.timestamp).toLocaleTimeString();

      if (evt.type === "sms_received") {
        const f = evt.flight || {};
        const depDelay = f.depDelay;
        const arrDelay = f.arrDelay;
        div.innerHTML =
          '<div class="feed-header">' +
            '<span><span class="feed-tag received">SMS Received</span> ' +
            '<span class="feed-from">from ' + escapeHtml(evt.from) + '</span></span>' +
            '<span class="feed-time">' + escapeHtml(time) + '</span>' +
          '</div>' +
          '<div class="feed-flight-info">' +
            '<div class="feed-row"><span class="feed-label">Flight</span><span>' + escapeHtml(f.ident || evt.ident) + '</span></div>' +
            '<div class="feed-row"><span class="feed-label">Status</span><span>' + escapeHtml(f.status || "—") + '</span></div>' +
            '<div class="feed-row"><span class="feed-label">Route</span><span>' + escapeHtml(f.origin || "—") + ' → ' + escapeHtml(f.destination || "—") + '</span></div>' +
            '<div class="feed-row"><span class="feed-label">Dep delay</span><span>' + formatDelay(depDelay, true) + '</span></div>' +
            '<div class="feed-row"><span class="feed-label">Arr delay</span><span>' + formatDelay(arrDelay, true) + '</span></div>' +
          '</div>';
      } else if (evt.type === "calling") {
        div.innerHTML =
          '<div class="feed-header">' +
            '<span><span class="feed-tag calling">Calling User</span> ' +
            '<span class="feed-from">' + escapeHtml(evt.from) + '</span></span>' +
            '<span class="feed-time">' + escapeHtml(time) + '</span>' +
          '</div>' +
          '<div class="feed-flight-info">' +
            '<div class="feed-row"><span class="feed-label">Reading flight info for</span><span>' + escapeHtml(evt.ident) + '</span></div>' +
          '</div>';
      }

      return div;
    }

    // Poll every 3 seconds
    setInterval(pollEvents, 3000);
    pollEvents();
  </script>

</body>
</html>
